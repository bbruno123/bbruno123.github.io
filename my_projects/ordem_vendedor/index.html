<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Ordem Vendedor</title>
</head>
<body>
    <div id="UI">
        <h1>Vendedores</h1>
        <div class="adicionar hidden">
            <input type="text" id="nome_vendedor" placeholder="Nome do vendedor">
            <button id="adicionar_vendedor">Adicionar</button>
        </div>
        <ul id="lista_vendedores"></ul>
        <button id="editar">Editar</button>
        <button id="gerar_relatorio_manual" type="button">Gerar Relatório</button>
        <button id="selecionar_pasta_relatorios" type="button">
            Selecionar pasta dos relatórios
        </button>
        <div id="resultado_overlay" class="hidden">
            <div class="resultado_opcoes">
                <button type="button" data-resultado="vendeu">Vendeu</button>
                <button type="button" data-resultado="naoVendeu">Não Vendeu</button>
            </div>
        </div>
    </div>
    <script src="script.js?v=20260910-3"></script>
</body>

</html>
