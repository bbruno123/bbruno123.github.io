<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pong</title>
</head>
    <body>
        <span class="bar" id="bot"></span>
        <span class="bar" id="player"></span>
        <span id="ball"></span>
        <div id="UI">
            <span class="score" id="scorePlayer"></span>
            <span class="score" id="scoreBot"></span>
            <div class="hidden" id="gameOverUI">
                <p id="gameOver">Game Over</p>
                <p class="restart">Restart</p>
            </div>
            <div class="hidden" id="youWinUI">
                <p id="youWin">You Win!</p>
                <p class="restart">Restart</p>
            </div>
        </div>
    </body>
    <script src="main.js"></script>
</html>
